<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
  <title id="title">Dang Tien Dung animated developer terminal</title>
  <desc id="desc">A neon terminal with animated scan line, status messages, and loading bars.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset=".55" stop-color="#0d1025"/>
      <stop offset="1" stop-color="#13082d"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00e5ff"/>
      <stop offset=".5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ff4ecd"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00ff9c"/>
      <stop offset=".52" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#6250b5" stroke-opacity=".1" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="terminalClip">
      <rect x="35" y="35" width="1030" height="260" rx="8"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="1096" height="326" rx="22" fill="url(#panel)" stroke="url(#stroke)" stroke-width="3"/>
  <rect x="3" y="3" width="1094" height="324" rx="21" fill="url(#grid)"/>

  <circle cx="34" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="55" cy="26" r="6" fill="#febc2e"/>
  <circle cx="76" cy="26" r="6" fill="#28c840"/>
  <text x="550" y="30" text-anchor="middle" fill="#7f8aa8" font-family="'Courier New', monospace" font-size="12" letter-spacing="3">DUNG@DEV-MACHINE — SYSTEM CORE</text>

  <g clip-path="url(#terminalClip)" font-family="'Courier New', monospace">
    <rect x="35" y="48" width="1030" height="2" fill="#00e5ff" opacity=".55" filter="url(#glow)">
      <animate attributeName="y" values="48;296;48" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".15;.7;.15" dur="5s" repeatCount="indefinite"/>
    </rect>

    <text x="48" y="72" fill="#00ff9c" font-size="16">
      <tspan fill="#ff4ecd">dung@github</tspan><tspan fill="#7f8aa8">:</tspan><tspan fill="#00e5ff">~</tspan><tspan fill="#f4f7ff">$ </tspan>
      <tspan>boot --profile full-stack</tspan>
    </text>

    <g opacity="0">
      <text x="48" y="108" fill="#9aa4bf" font-size="14">[01] Loading creativity engine</text>
      <rect x="360" y="96" width="460" height="14" rx="7" fill="#1b2441"/>
      <rect x="360" y="96" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#glow)">
        <animate attributeName="width" from="0" to="460" dur="1.6s" begin=".45s" fill="freeze"/>
      </rect>
      <text x="844" y="108" fill="#00ff9c" font-size="14">ONLINE</text>
      <animate attributeName="opacity" from="0" to="1" dur=".35s" begin=".35s" fill="freeze"/>
    </g>

    <g opacity="0">
      <text x="48" y="144" fill="#9aa4bf" font-size="14">[02] Mounting tech arsenal</text>
      <rect x="360" y="132" width="460" height="14" rx="7" fill="#1b2441"/>
      <rect x="360" y="132" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#glow)">
        <animate attributeName="width" from="0" to="460" dur="1.4s" begin="1.25s" fill="freeze"/>
      </rect>
      <text x="844" y="144" fill="#00ff9c" font-size="14">READY</text>
      <animate attributeName="opacity" from="0" to="1" dur=".35s" begin="1.15s" fill="freeze"/>
    </g>

    <g opacity="0">
      <text x="48" y="180" fill="#9aa4bf" font-size="14">[03] Connecting to GitHub</text>
      <rect x="360" y="168" width="460" height="14" rx="7" fill="#1b2441"/>
      <rect x="360" y="168" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#glow)">
        <animate attributeName="width" from="0" to="460" dur="1.2s" begin="2s" fill="freeze"/>
      </rect>
      <text x="844" y="180" fill="#00ff9c" font-size="14">LINKED</text>
      <animate attributeName="opacity" from="0" to="1" dur=".35s" begin="1.9s" fill="freeze"/>
    </g>

    <g opacity="0">
      <text x="48" y="216" fill="#9aa4bf" font-size="14">[04] Compiling new ideas</text>
      <rect x="360" y="204" width="460" height="14" rx="7" fill="#1b2441"/>
      <rect x="360" y="204" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#glow)">
        <animate attributeName="width" from="0" to="460" dur="1.25s" begin="2.55s" fill="freeze"/>
      </rect>
      <text x="844" y="216" fill="#00ff9c" font-size="14">100%</text>
      <animate attributeName="opacity" from="0" to="1" dur=".35s" begin="2.45s" fill="freeze"/>
    </g>

    <g opacity="0">
      <text x="48" y="264" fill="#00e5ff" font-size="16" filter="url(#glow)">SYSTEM READY</text>
      <text x="180" y="264" fill="#d7ddf1" font-size="16">— Let's build something meaningful.</text>
      <rect x="552" y="249" width="10" height="19" rx="1" fill="#ff4ecd">
        <animate attributeName="opacity" values="1;0;1" dur=".85s" repeatCount="indefinite"/>
      </rect>
      <animate attributeName="opacity" from="0" to="1" dur=".5s" begin="3.5s" fill="freeze"/>
    </g>

    <g opacity=".75">
      <circle cx="1014" cy="258" r="24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7">
        <animateTransform attributeName="transform" type="rotate" from="0 1014 258" to="360 1014 258" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1014" cy="258" r="12" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="3 5">
        <animateTransform attributeName="transform" type="rotate" from="360 1014 258" to="0 1014 258" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1014" cy="258" r="3" fill="#ff4ecd" filter="url(#glow)"/>
    </g>
  </g>

  <rect x="20" y="312" width="1060" height="2" rx="1" fill="#25304d"/>
  <rect x="20" y="312" width="220" height="2" rx="1" fill="url(#stroke)" filter="url(#glow)">
    <animate attributeName="x" values="20;860;20" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>

